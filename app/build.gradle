plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def squadChatBuildVersion = providers.gradleProperty('squadChatVersionCode').getOrElse('1')
def squadChatBuildVersionCode = squadChatBuildVersion.toInteger()

android {
    namespace 'com.squadchat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.squadchat.app'
        minSdk 24
        targetSdk 35
        versionCode squadChatBuildVersionCode
        versionName "1.0.${squadChatBuildVersion}"
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
