plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "com.squadchat.nativeapp"
    compileSdk 36

    defaultConfig {
        applicationId "com.squadchat.nativeapp"
        // Supabase Kotlin SDK 3.x requires Android 26 or newer.
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        // The legacy anon key is a public client key; database access remains protected by RLS.
        // Never put a Supabase secret/service-role key in this file.
        buildConfigField "String", "SUPABASE_URL", "\"https://xochwkeytdumpvvjzpdv.supabase.co\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvY2h3a2V5dGR1bXB2dmp6cGR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDIxNzcsImV4cCI6MjEwODMxODE3N30.rIRdiphkPIDsFQy16edKPZPkJpQKIWQT1SbUNy8NqNY\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"

    // Pinned stable Supabase Kotlin SDK and matching Ktor Android engine.
    implementation platform("io.github.jan-tennert.supabase:bom:3.5.0")
    implementation "io.github.jan-tennert.supabase:auth-kt"
    implementation "io.github.jan-tennert.supabase:postgrest-kt"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "io.ktor:ktor-client-android:3.0.3"

    debugImplementation "androidx.compose.ui:ui-tooling"
