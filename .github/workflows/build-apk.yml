
name: Build SquadChat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose AndroidManifest
        run: |
          echo "=== AndroidManifest.xml with line numbers ==="
          cat -n app/src/main/AndroidManifest.xml
          echo "=== Gradle manifest diagnostic ==="
          gradle --no-daemon :app:processDebugMainManifest --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SquadChat-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
