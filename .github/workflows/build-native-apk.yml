name: Build SquadChat Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android
      - native-ui-rebuild-review
    paths:
      - "native/**"
      - ".github/workflows/build-native-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build native debug APK
        run: gradle --no-daemon -p native assembleDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: SquadChat-Native-debug-APK
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
